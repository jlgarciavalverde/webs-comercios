[project]
name = "webs-comercios"
version = "0.1.0"
description = "Agente que prepara demos web y dossiers para comercios de Murcia"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "qrcode[pil]>=8.0", "httpx>=0.28"]

[project.scripts]
webs = "webs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
